<!doctype html><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#0B0E24}
  /* Play's feature graphic is a fixed 1024x500 canvas — build at exact size so
     nothing is scaled or cropped on upload. */
  .fg{position:relative;width:1024px;height:500px;overflow:hidden;background:#0B0E24;
      font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  /* Brand light: the icon's cyan-to-magenta, thrown as two soft sources so the
     flat navy has depth without competing with the wordmark. */
  .fg::before{content:"";position:absolute;inset:-30%;
    background:radial-gradient(closest-side at 78% 28%, rgba(34,211,238,.55), transparent 70%),
               radial-gradient(closest-side at 92% 78%, rgba(192,38,211,.50), transparent 70%),
               radial-gradient(closest-side at 8% 92%, rgba(99,102,241,.28), transparent 70%);
    filter:blur(6px)}
  .inner{position:relative;height:100%;display:flex;flex-direction:column;
         justify-content:center;gap:20px;padding:0 0 0 72px;max-width:520px}
  .inner img{width:430px;height:auto;display:block}
  .tag{color:#fff;font-size:31px;line-height:1.25;font-weight:600;letter-spacing:-.4px;margin:0}
  .sub{color:rgba(255,255,255,.72);font-size:18px;line-height:1.45;margin:0;font-weight:400;max-width:440px}
  /* A hint of the catalogue: bars that read as sound without claiming to be a
     waveform of anything in particular. */
  .bars{position:absolute;right:64px;bottom:0;top:0;display:flex;align-items:center;gap:9px}
  .bars i{display:block;width:9px;border-radius:6px;
     background:linear-gradient(180deg,#22d3ee,#a855f7 55%,#d946ef)}
</style>
