<!DOCTYPE html>
<!-- The apps' offline screen (Capacitor server.errorPath, 2026-09-29). The iOS/Android apps load
     the live site; when it can't be reached this page is shown from INSIDE the app bundle, so it
     must be fully self-contained: no web fonts, no network, only the bundled logo. It retries by
     itself when the phone comes back online. Apple reviewers test exactly this (guideline 4.2). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08080c">
  <title>Music Africa Direct — offline</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: #08080c; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex; align-items: center; justify-content: center; text-align: center;
      padding: calc(24px + env(safe-area-inset-top)) 28px calc(24px + env(safe-area-inset-bottom));
      overflow: hidden;
    }
    .glow { position: fixed; width: 420px; height: 420px; border-radius: 50%; filter: blur(90px); opacity: 0.35; pointer-events: none; }
    .glow-a { background: #3df7ff; top: -180px; left: -160px; }
    .glow-b { background: #a72fff; bottom: -200px; right: -180px; }
    main { position: relative; max-width: 340px; width: 100%; }
    .logo { width: 170px; max-width: 60%; height: auto; margin-bottom: 36px; }
    .icon { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 50%; display: grid; place-items: center;
      background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12); }
    h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; margin: 0 0 10px; }
    p { font-size: 15px; line-height: 1.5; color: rgba(255, 255, 255, 0.66); margin: 0 0 28px; }
    button { width: 100%; height: 52px; border: 0; border-radius: 999px; cursor: pointer;
      background: linear-gradient(90deg, #3df7ff, #59c3ff 45%, #a72fff); color: #08080c;
      font: inherit; font-size: 16px; font-weight: 700; box-shadow: 0 10px 28px rgba(89, 195, 255, 0.26); }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.6; }
    .status { margin-top: 16px; font-size: 13px; color: rgba(255, 255, 255, 0.45); min-height: 18px; }
  </style>
</head>
<body>
  <div class="glow glow-a"></div><div class="glow glow-b"></div>
  <main>
    <img class="logo" src="img/Madmusiclogonew-dark.png" alt="Music Africa Direct" onerror="this.remove()">
    <div class="icon" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#3df7ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5.5 12.3a10 10 0 0 1 13 0"/><path d="M9 15.8a5 5 0 0 1 6 0"/><circle cx="12" cy="19.3" r="0.6" fill="#3df7ff"/><path d="M3 3l18 18"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>Music Africa Direct streams from the vault, so it needs an internet connection. Check your Wi-Fi or mobile data and we'll pick up where you left off.</p>
    <button type="button" id="retry">Try again</button>
    <div class="status" id="status" role="status"></div>
  </main>
  <script>
    // Where the apps normally live (capacitor.config.json server.url).
    var APP_URL = 'https://musicafricadirect.com/mobile';
    var btn = document.getElementById('retry');
    var status = document.getElementById('status');
    function retry() {
      if (!navigator.onLine) { status.textContent = 'Still no connection. We\'ll reconnect by ourselves when it\'s back.'; return; }
      btn.disabled = true;
      status.textContent = 'Reconnecting…';
      location.replace(APP_URL);
      setTimeout(function () { btn.disabled = false; status.textContent = 'Couldn\'t reach Music Africa Direct yet. Try again in a moment.'; }, 12000);
    }
    btn.addEventListener('click', retry);
    window.addEventListener('online', function () { setTimeout(retry, 800); });
  </script>
</body>
</html>
